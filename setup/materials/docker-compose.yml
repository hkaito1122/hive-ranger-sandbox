version: '3.8'

services:
  # 1. データベース (PostgreSQL)
  postgres-db:
    image: postgres:15-alpine # 持ち込んだ postgres-image.tar を使用
    container_name: sandbox-db
    environment:
      POSTGRES_MULTIPLE_DATABASES: "hive_meta,ranger_db"
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # 💡 初回起動時のDB初期化用。リポジトリ内のファイルをそのままマウント
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - sandbox-net
    restart: always

  # 2. Hadoop + HiveServer2 + Ranger Plugin
  hive-server:
    image: hive-ranger-sandbox-hive-server:latest # 💡 buildではなく、持ち込んだ tar イメージを直接指定
    container_name: sandbox-hive
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HIVE_HOME=/opt/hive
    ports:
      - "10000:10000" # HiveServer2 (Beeline接続用)
      - "19870:19870" # NameNode Web UI
    depends_on:
      - postgres-db
    networks:
      - sandbox-net
    restart: always

  # 3. Ranger Admin
  ranger-admin:
    image: hive-ranger-sandbox-ranger-admin:latest # 💡 buildではなく、持ち込んだ tar イメージを直接指定
    container_name: sandbox-ranger
    ports:
      - "6080:6080" # Ranger Web UI
    depends_on:
      - postgres-db
    networks:
      - sandbox-net
    restart: always

volumes:
  db-data:
    # 💡 Mac側のデータを制限環境にフォルダごと持っていく場合は、ここを ./postgres-data などのローカルマウントに変更してもOKです

networks:
  sandbox-net:
    driver: bridge
